<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buzz Now</title>
<meta name="description" content="Five concise, credible-sourced stories on AI + creative technology and cinema + filmmaking, refreshed daily.">
<meta name="author" content="Arno Faure">

<meta property="og:type" content="website">
<meta property="og:title" content="Buzz Now">
<meta property="og:description" content="Five concise, credible-sourced stories on AI + creative technology and cinema + filmmaking, refreshed daily.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230c0c0d%22/><text x=%2216%22 y=%2223%22 font-family=%22Arial,sans-serif%22 font-weight=%22900%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%23e6ff3d%22>B</text></svg>">
<meta name="theme-color" content="#0c0c0d">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buzz">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f6f1;
  --surface:#ffffff;
  --surface-2:#efece3;
  --text:#17160f;
  --muted:rgba(23,22,15,.6);
  --divider:rgba(23,22,15,.12);
  --accent:#dcff34;
  --accent-ink:#14150a;
  --ai:#5b3df0;
  --film:#e0621c;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0d;
    --surface:#18181a;
    --surface-2:#212123;
    --text:#f6f4ee;
    --muted:rgba(246,244,238,.62);
    --divider:rgba(246,244,238,.14);
    --accent:#e6ff3d;
    --accent-ink:#121307;
    --ai:#9b86ff;
    --film:#ffab5e;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0d;
  --surface:#18181a;
  --surface-2:#212123;
  --text:#f6f4ee;
  --muted:rgba(246,244,238,.62);
  --divider:rgba(246,244,238,.14);
  --accent:#e6ff3d;
  --accent-ink:#121307;
  --ai:#9b86ff;
  --film:#ffab5e;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.wrap{max-width:600px;margin:0 auto;padding:0 20px 60px}

.app-header{padding:calc(env(safe-area-inset-top,0px) + 28px) 0 18px;border-bottom:2px solid var(--divider);margin-bottom:6px}
.wordmark{font:900 34px/1 Archivo,sans-serif;letter-spacing:-.03em}
.wordmark span{color:var(--accent);-webkit-text-stroke:1px var(--text)}
.app-kicker{font:800 11px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.app-date{font:600 13px Archivo,sans-serif;color:var(--muted);margin-top:4px}

.tag{display:inline-flex;align-items:center;font:800 10px Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:6px;color:#fff;flex:none}
.tag.ai{background:var(--ai)}
.tag.film{background:var(--film)}

.tick-item{border-bottom:1px solid var(--divider)}
.tick-item:last-child{border-bottom:none}
.tick-btn{width:100%;text-align:left;padding:20px 0;display:flex;gap:14px;align-items:flex-start}
.tick-num{font:900 14px Archivo,sans-serif;color:var(--muted);padding-top:5px;flex:none;width:20px;font-variant-numeric:tabular-nums}
.tick-main{flex:1;min-width:0}
.tick-headline{font:800 20px/1.3 Archivo,sans-serif;letter-spacing:-.01em;text-wrap:balance}
.tick-meta{display:flex;align-items:center;gap:8px;margin-top:9px}
.tick-plus{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--divider);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .2s,background .2s,color .2s,border-color .2s;margin-top:3px}
.tick-item.open .tick-plus{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tick-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.tick-item.open .tick-detail{grid-template-rows:1fr}
.tick-detail-inner{overflow:hidden;padding:2px 0 20px 34px;min-height:0}
.tick-summary{font:500 16.5px/1.62 Archivo,sans-serif;color:var(--muted)}
.tick-source{display:inline-flex;align-items:center;gap:6px;font:700 13px Archivo,sans-serif;margin-top:14px;color:var(--text)}
.tick-source svg{opacity:.65;flex:none}

.empty,.error{padding:44px 0;color:var(--muted);font:500 15px/1.6 Archivo,sans-serif;text-align:center}

.footer{margin-top:6px;padding-top:20px;color:var(--muted);font:600 11.5px Archivo,sans-serif;text-align:center;letter-spacing:.04em}
</style>
</head>
<body>

<div class="wrap">
  <div class="app-header">
    <div class="wordmark">BUZZ<span>.</span></div>
    <div class="app-kicker">Now &middot; Daily Briefing</div>
    <div class="app-date" id="briefing-date"></div>
  </div>

  <div id="items"></div>

  <div class="footer" id="footer"></div>
</div>

<script>
const externalIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
const plusIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function label(topic){ return topic === 'film' ? 'Film' : 'AI'; }

function render(data){
  document.getElementById('briefing-date').textContent = fmtDate(data.date);

  const items = Array.isArray(data.items) ? data.items : [];
  const container = document.getElementById('items');

  if(!items.length){
    container.innerHTML = '<div class="empty">No briefing yet.</div>';
    return;
  }

  container.innerHTML = items.map((item, i) => `
    <div class="tick-item${i === 0 ? ' open' : ''}">
      <button class="tick-btn" onclick="this.closest('.tick-item').classList.toggle('open')">
        <span class="tick-num">${String(i + 1).padStart(2, '0')}</span>
        <span class="tick-main">
          <span class="tick-headline">${esc(item.headline)}</span>
          <span class="tick-meta"><span class="tag ${item.topic === 'film' ? 'film' : 'ai'}">${label(item.topic)}</span></span>
        </span>
        <span class="tick-plus">${plusIcon}</span>
      </button>
      <div class="tick-detail"><div class="tick-detail-inner">
        <p class="tick-summary">${esc(item.summary)}</p>
        ${item.source_url ? `<a class="tick-source" href="${esc(item.source_url)}" target="_blank" rel="noopener">${externalIcon} ${esc(item.source_name || 'Source')}</a>` : ''}
      </div></div>
    </div>
  `).join('');
}

fetch('data/briefing.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(render)
  .catch(() => {
    document.getElementById('items').innerHTML = '<div class="error">Could not load today\'s briefing.</div>';
  });
</script>

</body>
</html>
