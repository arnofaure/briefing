<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Briefing — AI & Film Daily</title>
<meta name="description" content="A daily 5-item briefing on AI + creative technology and cinema + filmmaking news, generated automatically.">
<meta name="author" content="Arno Faure">

<meta property="og:type" content="website">
<meta property="og:title" content="Briefing — AI & Film Daily">
<meta property="og:description" content="Five concise, credible-sourced stories on AI + creative technology and cinema + filmmaking, refreshed daily.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23121212%22/><rect x=%228%22 y=%228%22 width=%227%22 height=%2216%22 rx=%221.5%22 fill=%22%23d4a72c%22/><rect x=%2217%22 y=%228%22 width=%227%22 height=%2210%22 rx=%221.5%22 fill=%22%233ecf8e%22/></svg>">
<meta name="theme-color" content="#121212">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#121212;
  --surface:#1c1b19;
  --surface-2:#232220;
  --text:#f5f4f2;
  --muted:rgba(245,244,242,.58);
  --divider:rgba(245,244,242,.14);
  --ai:#3ecf8e;
  --film:#d4a72c;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--film);outline-offset:2px}
img{max-width:100%;display:block}

.wrap{max-width:640px;margin:0 auto;padding:0 20px 60px}

.header{padding:calc(env(safe-area-inset-top,0px) + 32px) 0 22px;border-bottom:2px solid var(--divider);margin-bottom:28px}
.kicker{font:800 11px/1 Archivo,sans-serif;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.title{font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin-top:8px}
.date{font:600 13px Archivo,sans-serif;color:var(--muted);margin-top:8px}

.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.card-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2)}
.card-body{padding:18px 20px 20px}
.badge{display:inline-block;font:800 10px Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:5px}
.badge.ai{color:#0d1f16;background:var(--ai)}
.badge.film{color:#241a04;background:var(--film)}
.headline{font:700 19px/1.35 Archivo,sans-serif;letter-spacing:-.01em;margin:12px 0 8px}
.summary{font:500 14px/1.6 Archivo,sans-serif;color:var(--muted);margin:0 0 14px}
.source{display:inline-flex;align-items:center;gap:6px;font:700 12px Archivo,sans-serif;color:var(--text);border-top:1px solid var(--divider);padding-top:12px;width:100%}
.source svg{flex:none;opacity:.7}
.source:hover svg{opacity:1}

.empty,.error{padding:40px 0;color:var(--muted);font:500 14px/1.6 Archivo,sans-serif}

.footer{margin-top:8px;color:var(--muted);font:500 12px Archivo,sans-serif;text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="kicker">Daily briefing</div>
    <div class="title">AI &amp; Film</div>
    <div class="date" id="briefing-date"></div>
  </div>

  <div id="items"></div>

  <div class="footer" id="footer"></div>
</div>

<script>
const externalIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function render(data){
  document.getElementById('briefing-date').textContent = fmtDate(data.date);

  const items = Array.isArray(data.items) ? data.items : [];
  const container = document.getElementById('items');

  if(!items.length){
    container.innerHTML = '<div class="empty">No briefing yet.</div>';
    return;
  }

  container.innerHTML = items.map(item => `
    <article class="card">
      ${item.image_url ? `<img class="card-img" src="${esc(item.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      <div class="card-body">
        <span class="badge ${item.topic === 'film' ? 'film' : 'ai'}">${item.topic === 'film' ? 'Film' : 'AI'}</span>
        <h2 class="headline">${esc(item.headline)}</h2>
        <p class="summary">${esc(item.summary)}</p>
        ${item.source_url ? `<a class="source" href="${esc(item.source_url)}" target="_blank" rel="noopener">${externalIcon} ${esc(item.source_name || 'Source')}</a>` : ''}
      </div>
    </article>
  `).join('');
}

fetch('data/briefing.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(render)
  .catch(() => {
    document.getElementById('items').innerHTML = '<div class="error">Could not load today\'s briefing.</div>';
  });
</script>

</body>
</html>
