<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buzz Now</title>
<meta name="description" content="AI + creative tech, cinema + filmmaking, and society — six concise, credible-sourced stories refreshed daily.">
<meta name="author" content="Arno Faure">

<meta property="og:type" content="website">
<meta property="og:title" content="Buzz Now">
<meta property="og:description" content="AI + creative tech, cinema + filmmaking, and society — six concise, credible-sourced stories refreshed daily.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%23e6ff3d%22/></svg>">
<meta name="theme-color" content="#0c0c0d">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buzz">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f6f1;
  --surface:#ffffff;
  --surface-2:#efece3;
  --text:#17160f;
  --muted:rgba(23,22,15,.6);
  --divider:rgba(23,22,15,.12);
  --accent:#dcff34;
  --accent-ink:#14150a;
  --ai:#5b3df0;
  --film:#af3d8a;
  --society:#1f7a8c;
  --adhd:#8a6a1e;
  --philosophy:#2f4a8a;
  --fashion:#1e6b4a;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0d;
    --surface:#18181a;
    --surface-2:#212123;
    --text:#f6f4ee;
    --muted:rgba(246,244,238,.62);
    --divider:rgba(246,244,238,.14);
    --accent:#e6ff3d;
    --accent-ink:#121307;
    --ai:#9b86ff;
    --film:#f195d6;
    --society:#6cd4e6;
    --adhd:#e0b84a;
    --philosophy:#8fabf0;
    --fashion:#5fd9a8;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0d;
  --surface:#18181a;
  --surface-2:#212123;
  --text:#f6f4ee;
  --muted:rgba(246,244,238,.62);
  --divider:rgba(246,244,238,.14);
  --accent:#e6ff3d;
  --accent-ink:#121307;
  --ai:#9b86ff;
  --film:#f195d6;
  --society:#6cd4e6;
  --adhd:#e0b84a;
  --philosophy:#8fabf0;
  --fashion:#5fd9a8;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.wrap{max-width:600px;margin:0 auto;padding:0 20px 60px}

.app-header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 28px) 0 18px;border-bottom:2px solid var(--divider);margin-bottom:20px}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wordmark{font:900 34px/1 Archivo,sans-serif;letter-spacing:-.03em}
.app-kicker{font:800 11px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.app-date{font:600 13px Archivo,sans-serif;color:var(--muted);margin-top:4px}

.tabs{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;flex:none;padding-top:4px;max-width:180px}
.tab{padding:8px 13px;border-radius:999px;border:1.5px solid var(--divider);font:700 12px Archivo,sans-serif;color:var(--muted);background:var(--surface);transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.claude-take{background:var(--surface);border:1px solid var(--divider);border-left:3px solid var(--accent);border-radius:var(--radius);overflow:hidden;margin-bottom:22px}
.claude-take-img{width:100%;aspect-ratio:1/1;background:var(--surface-2);object-fit:cover;display:block}
.claude-take-text{padding:18px 20px}
.claude-take-kicker{font:800 10.5px Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.claude-take-note{font:600 11.5px Archivo,sans-serif;color:var(--muted);margin-top:4px}
.claude-take-body{font:500 16px/1.6 Archivo,sans-serif;color:var(--text);margin-top:12px}

.topic-group{border-radius:var(--radius);margin-bottom:16px;overflow:hidden;background:var(--surface)}
.topic-group.ai{border:1.5px solid color-mix(in srgb, var(--ai) 38%, transparent)}
.topic-group.film{border:1.5px solid color-mix(in srgb, var(--film) 38%, transparent)}
.topic-group.society{border:1.5px solid color-mix(in srgb, var(--society) 38%, transparent)}
.topic-group.adhd{border:1.5px solid color-mix(in srgb, var(--adhd) 38%, transparent)}
.topic-group.philosophy{border:1.5px solid color-mix(in srgb, var(--philosophy) 38%, transparent)}
.topic-group.fashion{border:1.5px solid color-mix(in srgb, var(--fashion) 38%, transparent)}
.topic-group-label{padding:13px 18px 0;font:800 11px Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.topic-group-label.ai{color:var(--ai)}
.topic-group-label.film{color:var(--film)}
.topic-group-label.society{color:var(--society)}
.topic-group-label.adhd{color:var(--adhd)}
.topic-group-label.philosophy{color:var(--philosophy)}
.topic-group-label.fashion{color:var(--fashion)}
.topic-group .tick-row{padding-left:18px;padding-right:18px}
.topic-group .tick-detail{padding-left:18px}
.topic-group .tick-detail-inner{padding-right:18px}

.tick-item{border-bottom:1px solid var(--divider)}
.tick-item:last-child{border-bottom:none}
.tick-row{display:flex;align-items:flex-start;gap:6px;padding:20px 0}
.tick-btn{flex:1;min-width:0;text-align:left;display:flex;gap:14px;align-items:flex-start}
.tick-main{flex:1;min-width:0}
.tick-headline{font:800 20px/1.3 Archivo,sans-serif;letter-spacing:-.01em;text-wrap:balance}
.tick-plus{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--divider);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .2s,background .2s,color .2s,border-color .2s;margin-top:-6px}
.tick-item.open .tick-plus{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tick-save{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--divider);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s,border-color .15s;margin-top:-6px}
.tick-save.saved{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tick-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.tick-item.open .tick-detail{grid-template-rows:1fr}
.tick-detail-inner{overflow:hidden;padding:2px 0 20px 0;min-height:0}
.tick-summary{font:500 16.5px/1.62 Archivo,sans-serif;color:var(--muted)}
.tick-actions{display:flex;align-items:center;gap:20px;margin-top:14px}
.tick-source{display:inline-flex;align-items:center;gap:6px;font:700 13px Archivo,sans-serif;color:var(--text)}
.tick-source svg{opacity:.65;flex:none}
.tick-share-btn{display:inline-flex;align-items:center;gap:6px;font:700 13px Archivo,sans-serif;color:var(--muted)}
.tick-share-btn svg{opacity:.65;flex:none}

.lang-toggle{display:flex;gap:6px;margin:10px 0 14px}
.lang-btn{padding:5px 12px;border-radius:999px;border:1.5px solid var(--divider);font:800 10.5px Archivo,sans-serif;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
.lang-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.empty,.error{padding:44px 0;color:var(--muted);font:500 15px/1.6 Archivo,sans-serif;text-align:center}

.timeline-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.timeline-card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);overflow:hidden}
.timeline-img{width:100%;aspect-ratio:1/1;background:var(--surface-2);object-fit:cover;display:block}
.timeline-body{padding:12px 14px 14px}
.timeline-date{font:800 10px Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.timeline-title{font:700 13.5px/1.4 Archivo,sans-serif;color:var(--text);margin-top:6px}

.lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,8,7,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.lightbox.open{display:flex}
.lightbox-stage{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
.lightbox-img-wrap{width:100%;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:var(--surface-2)}
.lightbox-img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox-nav-row{width:100%;display:flex;align-items:center;gap:12px;margin-top:16px}
.lightbox-nav{position:static;flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);color:rgba(246,244,238,.75);display:flex;align-items:center;justify-content:center;border:none;transition:background .15s,color .15s}
.lightbox-nav:hover{background:rgba(255,255,255,.18);color:#f6f4ee}
.lightbox-caption{flex:1;min-width:0;text-align:center}
.lightbox-date{font:800 11px Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,244,238,.6)}
.lightbox-title{font:700 17px/1.4 Archivo,sans-serif;color:#f6f4ee;margin-top:6px}
.lightbox-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;border:none}

.account-card{background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);padding:20px;margin-bottom:8px}
.account-title{font:800 16px Archivo,sans-serif;letter-spacing:-.01em}
.account-note{font:500 13px/1.5 Archivo,sans-serif;color:var(--muted);margin-top:6px}
.account-row{display:flex;gap:8px;margin-top:14px}
.account-row input{flex:1;min-width:0;font:600 14px Archivo,sans-serif;padding:11px 13px;border-radius:10px;border:1.5px solid var(--divider);background:var(--bg);color:var(--text)}
.account-btn{flex:none;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:800 13px Archivo,sans-serif;height:42px}
.account-row-col{flex-direction:column;align-items:stretch}
.account-row-col input,.account-row-col .account-btn{width:100%;height:42px}
.account-msg{font:600 12.5px Archivo,sans-serif;color:var(--muted);margin-top:10px;min-height:1em}
.account-toggle{display:block;font:700 12px Archivo,sans-serif;color:var(--muted);text-decoration:underline;text-underline-offset:2px;margin-top:12px}
.account-bar-signed{display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 12.5px Archivo,sans-serif;color:var(--muted);padding-bottom:16px}
.account-links{display:flex;gap:16px;flex:none}
.account-signout{color:var(--text);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}

.footer{margin-top:6px;padding-top:20px;color:var(--muted);font:600 11.5px Archivo,sans-serif;text-align:center;letter-spacing:.04em}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);font:700 13px Archivo,sans-serif;padding:13px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:86vw;text-align:center;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="wrap">
  <div class="app-header">
    <div class="header-top">
      <div>
        <div class="wordmark">BUZZ</div>
        <div class="app-kicker">Now &middot; Daily Briefing</div>
        <div class="app-date" id="briefing-date"></div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="today">Today</button>
        <button class="tab" data-tab="saved">Saved <span id="saved-count">(0)</span></button>
        <button class="tab" data-tab="timeline">Timeline</button>
      </div>
    </div>
  </div>

  <div id="claude-take"></div>
  <div id="account-bar"></div>
  <div id="items"></div>
  <div id="timeline"></div>

  <div class="footer" id="footer"></div>
</div>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
  </button>
  <div class="lightbox-stage">
    <div class="lightbox-img-wrap">
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
    </div>
    <div class="lightbox-nav-row">
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="lightbox-caption">
        <div class="lightbox-date" id="lightbox-date"></div>
        <div class="lightbox-title" id="lightbox-title"></div>
      </div>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SAVE_LIMIT = 10;
const SUPABASE_URL = 'https://jdzgnykqcjciivmszgaa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WW7D_DEiAyjmk-z45OCjfw_HvrI3qMH';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const externalIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
const plusIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
const bookmarkIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
const bookmarkFilledIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
const shareIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>';

let currentTab = 'today';
let todayData = null;
let timelineData = null;
let toastTimer = null;
let currentUser = null;
let savedItems = [];
let authMode = 'magic';
let settingPassword = false;
let philosophyLang = 'fr';
try{
  const savedLang = localStorage.getItem('buzz_philosophy_lang');
  if(savedLang === 'fr' || savedLang === 'en') philosophyLang = savedLang;
}catch(e){}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function label(topic){
  if(topic === 'film') return 'Film';
  if(topic === 'society') return 'Society';
  if(topic === 'fashion') return 'Fashion';
  if(topic === 'adhd') return 'ADHD';
  if(topic === 'philosophy') return 'Philosophy';
  return 'AI';
}

function tagClass(topic){
  if(topic === 'film') return 'film';
  if(topic === 'society') return 'society';
  if(topic === 'fashion') return 'fashion';
  if(topic === 'adhd') return 'adhd';
  if(topic === 'philosophy') return 'philosophy';
  return 'ai';
}

function isSaved(item){
  return savedItems.some(s => s.source_url === item.source_url);
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

async function fetchSavedItems(){
  if(!currentUser){ savedItems = []; return; }
  const { data, error } = await db.from('buzz_saved')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });
  savedItems = error ? [] : (data || []);
}

async function toggleSave(key){
  const item = window.__buzzItems[key];
  if(!item) return;

  if(!currentUser){
    showToast('Sign in on the Saved tab to save stories.');
    return;
  }

  const idx = savedItems.findIndex(s => s.source_url === item.source_url);

  if(idx >= 0){
    const row = savedItems[idx];
    const { error } = await db.from('buzz_saved').delete().eq('id', row.id);
    if(error){ showToast('Could not remove — try again.'); return; }
    savedItems.splice(idx, 1);
  } else {
    if(savedItems.length >= SAVE_LIMIT){
      showToast('You already have ' + SAVE_LIMIT + ' saved — remove one to add more.');
      return;
    }
    const { data, error } = await db.from('buzz_saved').insert({
      user_id: currentUser.id,
      source_url: item.source_url,
      headline: item.headline,
      summary: item.summary,
      topic: item.topic,
      source_name: item.source_name,
      briefing_date: todayData ? todayData.date : null
    }).select().single();
    if(error){ showToast('Could not save — try again.'); return; }
    savedItems.unshift(data);
  }

  updateSavedCount();
  renderActiveTab();
}

async function sendMagicLink(){
  const emailEl = document.getElementById('signin-email');
  const msgEl = document.getElementById('signin-msg');
  if(!emailEl || !msgEl) return;
  const email = emailEl.value.trim();
  if(!email){ msgEl.textContent = 'Enter your email first.'; return; }
  msgEl.textContent = 'Sending…';
  const { error } = await db.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  msgEl.textContent = error ? error.message : 'Check your email for the sign-in link.';
}

async function signInWithPassword(){
  const emailEl = document.getElementById('signin-email');
  const passEl = document.getElementById('signin-password');
  const msgEl = document.getElementById('signin-msg');
  if(!emailEl || !passEl || !msgEl) return;
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ msgEl.textContent = 'Enter your email and password.'; return; }
  msgEl.textContent = 'Signing in…';
  const { error } = await db.auth.signInWithPassword({ email, password });
  if(error) msgEl.textContent = 'Email or password not recognized.';
}

async function savePassword(){
  const passEl = document.getElementById('new-password');
  const msgEl = document.getElementById('signin-msg');
  if(!passEl || !msgEl) return;
  const password = passEl.value;
  if(password.length < 8){ msgEl.textContent = 'Use at least 8 characters.'; return; }
  msgEl.textContent = 'Saving…';
  const { error } = await db.auth.updateUser({ password });
  if(error){ msgEl.textContent = error.message; return; }
  settingPassword = false;
  showToast('Password saved — sign in directly from the Home Screen app any time.');
  renderAccountBar();
}

async function signOut(){
  await db.auth.signOut();
  settingPassword = false;
  authMode = 'magic';
}

function setPhilosophyLang(lang){
  philosophyLang = lang;
  try{ localStorage.setItem('buzz_philosophy_lang', lang); }catch(e){}
  document.querySelectorAll('.tick-item[data-key]').forEach(el => {
    const item = window.__buzzItems[el.dataset.key];
    if(!item || item.topic !== 'philosophy' || !item.headline_fr || !item.summary_fr) return;
    const useFr = lang === 'fr';
    const headlineEl = el.querySelector('.tick-headline');
    const summaryEl = el.querySelector('.tick-summary');
    if(headlineEl) headlineEl.textContent = useFr ? item.headline_fr : item.headline;
    if(summaryEl) summaryEl.textContent = useFr ? item.summary_fr : item.summary;
    el.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === lang);
    });
  });
}

function shareItem(key){
  const item = window.__buzzItems[key];
  if(!item) return;
  const useFr = item.topic === 'philosophy' && item.headline_fr && item.summary_fr && philosophyLang === 'fr';
  const shareText = (useFr ? item.headline_fr : item.headline) + '\n\n' + (useFr ? item.summary_fr : item.summary);

  if(navigator.share){
    navigator.share({ title: item.headline, text: shareText, url: item.source_url || undefined }).catch(() => {});
    return;
  }

  const subject = encodeURIComponent(item.headline);
  const body = encodeURIComponent(shareText + (item.source_url ? '\n\n' + item.source_url : ''));
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

function updateSavedCount(){
  document.getElementById('saved-count').textContent = '(' + savedItems.length + ')';
}

function tickItemHtml(item, i){
  const key = (currentTab === 'saved' ? 'saved-' : 'today-') + i;
  window.__buzzItems[key] = item;
  const saved = isSaved(item);
  const isBilingual = item.topic === 'philosophy' && item.headline_fr && item.summary_fr;
  const useFr = isBilingual && philosophyLang === 'fr';
  const headline = useFr ? item.headline_fr : item.headline;
  const summary = useFr ? item.summary_fr : item.summary;
  const langToggle = isBilingual ? `
    <div class="lang-toggle" onclick="event.stopPropagation()">
      <button class="lang-btn${philosophyLang === 'fr' ? ' active' : ''}" onclick="setPhilosophyLang('fr')">FR</button>
      <button class="lang-btn${philosophyLang === 'en' ? ' active' : ''}" onclick="setPhilosophyLang('en')">EN</button>
    </div>
  ` : '';
  return `
    <div class="tick-item${i === 0 && currentTab === 'today' ? ' open' : ''}" data-key="${key}">
      <div class="tick-row">
        <button class="tick-btn" onclick="this.closest('.tick-item').classList.toggle('open')">
          <span class="tick-main">
            <span class="tick-headline">${esc(headline)}</span>
          </span>
          <span class="tick-plus">${plusIcon}</span>
        </button>
        <button class="tick-save${saved ? ' saved' : ''}" aria-label="${saved ? 'Remove from saved' : 'Save'}" onclick="toggleSave('${key}')">${saved ? bookmarkFilledIcon : bookmarkIcon}</button>
      </div>
      <div class="tick-detail"><div class="tick-detail-inner">
        ${langToggle}
        <p class="tick-summary">${esc(summary)}</p>
        <div class="tick-actions">
          ${item.source_url ? `<a class="tick-source" href="${esc(item.source_url)}" target="_blank" rel="noopener">${externalIcon} ${esc(item.source_name || 'Source')}</a>` : ''}
          <button class="tick-share-btn" onclick="shareItem('${key}')">${shareIcon} Share</button>
        </div>
      </div></div>
    </div>
  `;
}

function renderList(items){
  window.__buzzItems = window.__buzzItems || {};
  const container = document.getElementById('items');

  if(!items.length){
    container.innerHTML = currentTab === 'saved'
      ? '<div class="empty">Nothing saved yet — tap the bookmark on any story to keep it here.</div>'
      : '<div class="empty">No briefing yet.</div>';
    return;
  }

  const groups = [];
  const groupIndexByTopic = {};
  items.forEach((item, i) => {
    const t = item.topic || 'ai';
    if(!(t in groupIndexByTopic)){
      groupIndexByTopic[t] = groups.length;
      groups.push({ topic: t, entries: [] });
    }
    groups[groupIndexByTopic[t]].entries.push({ item, i });
  });

  container.innerHTML = groups.map(g => `
    <div class="topic-group ${tagClass(g.topic)}">
      <div class="topic-group-label ${tagClass(g.topic)}">${label(g.topic)}</div>
      ${g.entries.map(({ item, i }) => tickItemHtml(item, i)).join('')}
    </div>
  `).join('');
}

function renderClaudeTake(){
  const el = document.getElementById('claude-take');
  if(currentTab !== 'today' || !todayData || !todayData.claude_take){
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `
    <div class="claude-take">
      ${todayData.claude_take_image_url ? `<img class="claude-take-img" src="${esc(todayData.claude_take_image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      <div class="claude-take-text">
        <div class="claude-take-kicker">Buzz's Take</div>
        <div class="claude-take-note">Claude's own read on today's stories — not neutral reporting.</div>
        <p class="claude-take-body">${esc(todayData.claude_take)}</p>
      </div>
    </div>
  `;
}

function renderAccountBar(){
  const el = document.getElementById('account-bar');

  if(currentTab !== 'saved'){
    el.innerHTML = '';
    return;
  }

  if(!currentUser){
    if(authMode === 'password'){
      el.innerHTML = `
        <div class="account-card">
          <div class="account-title">Sign in with password</div>
          <div class="account-note">Works directly inside the Home Screen app &mdash; no email link needed.</div>
          <div class="account-row account-row-col">
            <input type="email" id="signin-email" placeholder="you@email.com" autocomplete="email">
            <input type="password" id="signin-password" placeholder="Password" autocomplete="current-password">
            <button class="account-btn" id="signin-pw-submit">Sign in</button>
          </div>
          <div class="account-msg" id="signin-msg"></div>
          <button class="account-toggle" id="mode-toggle">Use an email link instead</button>
        </div>
      `;
      document.getElementById('signin-pw-submit').addEventListener('click', signInWithPassword);
      document.getElementById('mode-toggle').addEventListener('click', () => { authMode = 'magic'; renderAccountBar(); });
      return;
    }

    el.innerHTML = `
      <div class="account-card">
        <div class="account-title">Sign in to sync your saves</div>
        <div class="account-note">One-time magic link by email &mdash; only you can see or change your saved list.</div>
        <div class="account-row">
          <input type="email" id="signin-email" placeholder="you@email.com" autocomplete="email">
          <button class="account-btn" id="signin-send">Send link</button>
        </div>
        <div class="account-msg" id="signin-msg"></div>
        <button class="account-toggle" id="mode-toggle">Use a password instead</button>
      </div>
    `;
    document.getElementById('signin-send').addEventListener('click', sendMagicLink);
    document.getElementById('signin-email').addEventListener('keydown', e => { if(e.key === 'Enter') sendMagicLink(); });
    document.getElementById('mode-toggle').addEventListener('click', () => { authMode = 'password'; renderAccountBar(); });
    return;
  }

  if(settingPassword){
    el.innerHTML = `
      <div class="account-card">
        <div class="account-title">Set a password</div>
        <div class="account-note">Lets you sign in directly from the Home Screen app without an email link, since a link opens in Safari instead of the installed app.</div>
        <div class="account-row">
          <input type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8">
          <button class="account-btn" id="save-password">Save</button>
        </div>
        <div class="account-msg" id="signin-msg"></div>
      </div>
    `;
    document.getElementById('save-password').addEventListener('click', savePassword);
    return;
  }

  el.innerHTML = `
    <div class="account-bar-signed">
      <span>Signed in as ${esc(currentUser.email)}</span>
      <span class="account-links">
        <button class="account-signout" id="set-password-btn">Set password</button>
        <button class="account-signout" id="signout-btn">Sign out</button>
      </span>
    </div>
  `;
  document.getElementById('signout-btn').addEventListener('click', signOut);
  document.getElementById('set-password-btn').addEventListener('click', () => { settingPassword = true; renderAccountBar(); });
}

function fmtShortDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function renderTimeline(){
  const el = document.getElementById('timeline');
  const entries = timelineData && Array.isArray(timelineData.entries) ? timelineData.entries : [];

  if(!entries.length){
    el.innerHTML = '<div class="empty">No illustrations yet.</div>';
    return;
  }

  el.innerHTML = `<div class="timeline-grid">${entries.map((e, i) => `
    <button class="timeline-card" onclick="openLightbox(${i})">
      <img class="timeline-img" src="${esc(e.image_url)}" alt="" loading="lazy" onerror="this.closest('.timeline-card').remove()">
      <div class="timeline-body">
        <div class="timeline-date">${esc(fmtShortDate(e.date))}</div>
        <div class="timeline-title">${esc(e.title)}</div>
      </div>
    </button>
  `).join('')}</div>`;
}

let lightboxIndex = 0;

function openLightbox(i){
  lightboxIndex = i;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

function stepLightbox(delta){
  const entries = timelineData && Array.isArray(timelineData.entries) ? timelineData.entries : [];
  if(!entries.length) return;
  lightboxIndex = (lightboxIndex + delta + entries.length) % entries.length;
  renderLightbox();
}

function renderLightbox(){
  const entries = timelineData && Array.isArray(timelineData.entries) ? timelineData.entries : [];
  const e = entries[lightboxIndex];
  if(!e) return;
  document.getElementById('lightbox-img').src = e.image_url;
  document.getElementById('lightbox-date').textContent = fmtShortDate(e.date);
  document.getElementById('lightbox-title').textContent = e.title || '';
  const multi = entries.length > 1;
  document.getElementById('lightbox-prev').style.display = multi ? '' : 'none';
  document.getElementById('lightbox-next').style.display = multi ? '' : 'none';
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-prev').addEventListener('click', () => stepLightbox(-1));
document.getElementById('lightbox-next').addEventListener('click', () => stepLightbox(1));
document.getElementById('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => {
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') stepLightbox(-1);
  if(e.key === 'ArrowRight') stepLightbox(1);
});

function renderActiveTab(){
  renderClaudeTake();
  renderAccountBar();

  if(currentTab === 'timeline'){
    document.getElementById('items').innerHTML = '';
    if(timelineData){
      renderTimeline();
    } else {
      document.getElementById('timeline').innerHTML = '<div class="empty">Loading&hellip;</div>';
      fetch('data/timeline.json', { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          timelineData = data;
          if(currentTab === 'timeline') renderTimeline();
        })
        .catch(() => {
          document.getElementById('timeline').innerHTML = '<div class="error">Could not load the timeline.</div>';
        });
    }
    return;
  }

  document.getElementById('timeline').innerHTML = '';
  if(currentTab === 'saved'){
    if(!currentUser){
      document.getElementById('items').innerHTML = '';
      return;
    }
    renderList(savedItems);
  } else {
    renderList(todayData && Array.isArray(todayData.items) ? todayData.items : []);
  }
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    renderActiveTab();
  });
});

async function initAuth(){
  const { data: { session } } = await db.auth.getSession();
  currentUser = session?.user || null;
  if(currentUser) await fetchSavedItems();
  updateSavedCount();
  renderActiveTab();

  db.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    if(currentUser){
      await fetchSavedItems();
    } else {
      savedItems = [];
    }
    updateSavedCount();
    renderActiveTab();
  });
}

initAuth();

fetch('data/briefing.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    todayData = data;
    document.getElementById('briefing-date').textContent = fmtDate(data.date);
    renderActiveTab();
  })
  .catch(() => {
    document.getElementById('items').innerHTML = '<div class="error">Could not load today\'s briefing.</div>';
  });
</script>
